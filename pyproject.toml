[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liftlogic"
version = "0.1.0"
description = "AI-powered workout tracking built around Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client==2.199.0",
    "google-auth==2.56.3",
    "google-auth-oauthlib==1.2.4",
    "google-auth-httplib2==0.3.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.54.0",
]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.1",
]

[project.scripts]
liftlogic = "liftlogic.cli:main"
liftlogic-setup = "liftlogic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
